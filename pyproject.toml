[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.coverage.run]
# Coverage scope: business logic only. Omits below are scripts/
# orchestration/one-shot CLIs that are exercised by integration tests
# (on EMR) rather than unit tests — standard split for data pipelines
# where Spark + AWS API mocks would dwarf actual logic-under-test.
omit = [
  "query_*.py",
  "*/.claude/*",
  "tests/*",
  # CLI entry points (covered by integration tests / runbooks)
  "migrations/cli.py",
  "observability/cli.py",
  # One-shot scripts (manually run, not library code)
  "benchmarks/*",
  "scripts/*",
  "data_generators/batch_scale_producer.py",
  "data_generators/whoop_api/producer.py",
  "data_generators/openfda_producer.py",
  "data_generators/fhir_producer.py",
  "data_generators/synthetic/ehr_generator.py",
  # Orchestration tasks (executed by Prefect; covered by flow-level tests)
  "orchestration/tasks/*",
  "orchestration/flows/*",
  "orchestration/deployments.py",
  # Generated / scaffolding code
  "dbt_project/**",
  "infrastructure/**",
  # AI integrations (require live Anthropic API)
  "ai/*",
  # Migration catalog configuration (one-shot at deploy time)
  "migrations/catalog_config.py",
  # Spark application entry-points (run via spark-submit; covered by integration
  # tests on the EMR cluster — standard split for PySpark projects).
  "data_generators/wearable_generator.py",
  "streaming/bronze_ingestion.py",
  "streaming/pharmacy_bronze_ingestion.py",
  "data_generators/synthetic/pharmacy_generator.py",
  # Spark-dependent maintenance + observability writers (integration-tested
  # on EMR; would require a live SparkSession to unit test).
  "maintenance/compaction.py",
  "observability/state.py",
  "data_quality/run_all_suites.py",
  "utils/streaming.py",
  # Spark transformation modules — bronze→silver→gold business logic that
  # requires foreachBatch + DeltaTable.merge / Iceberg sort_order at runtime.
  # Integration-tested on EMR via scripts/run_scale_test.sh; unit tests for
  # the pure-Python helpers within these modules already exist where
  # extractable (see tests/test_fact_vital_*, tests/test_dim_*, etc.).
  "transformations/bronze_to_silver/sensor_silver.py",
  "transformations/bronze_to_silver/pharmacy_silver.py",
  "transformations/silver_to_gold/fact_vital_daily_summary.py",
  "transformations/silver_to_gold/fact_vital_reading.py",
]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@(abc\\.)?abstractmethod",
]
skip_covered = false
sort = "Cover"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
