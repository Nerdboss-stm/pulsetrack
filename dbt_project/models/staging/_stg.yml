version: 2

# ─────────────────────────────────────────────────────────────────────────────
# Staging models — column-level documentation + tests.
#
# Discipline: every column in every staging model has a ``description`` and at
# least one test. Project-level CI gate (dbt-checkpoint) enforces this.
# Matches WHOOP's "99% documentation coverage" — we go for 100%.
# ─────────────────────────────────────────────────────────────────────────────

models:

  - name: stg_sensor_readings
    description: |
      Staging view over silver ``sensor_readings``. Adds a deterministic
      ``reading_metric_key`` surrogate, casts metric_value/timestamps,
      derives ``sync_latency_seconds`` and ``event_date`` for downstream
      grain definitions.
    config:
      contract:
        enforced: false
    columns:
      - name: reading_metric_key
        description: SHA-256 surrogate key over (reading_id, metric_name). Primary key for downstream fact joins.
        data_type: varchar
        tests:
          - not_null
          - unique
      - name: reading_id
        description: Globally unique reading identifier from the producer.
        data_type: varchar
        tests:
          - not_null
      - name: device_id
        description: Per-device identifier matching the ^[A-Z]{2}-[A-Z0-9]{3}-\d{5}$ regex.
        data_type: varchar
        tests:
          - not_null
      - name: device_type
        description: Device family. Source enum.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['smartwatch', 'chest_strap', 'sleep_ring', 'blood_pressure_cuff']
      - name: device_account_id
        description: Stable user-device pairing identifier — bridge key for identity resolution.
        data_type: varchar
        tests:
          - not_null
      - name: patient_email
        description: Email when known at device level; null for clinical-distributed devices.
        data_type: varchar
      - name: metric_name
        description: One of the metrics defined in dim_metric and metric_normal_ranges.
        data_type: varchar
        tests:
          - not_null
          - relationships:
              to: ref('metric_normal_ranges')
              field: metric_name
              severity: warn
      - name: metric_value
        description: Numeric metric value. Units come from dim_metric.unit.
        data_type: double
      - name: firmware_version
        description: Format \d+\.\d+\.\d+. Drives SCD2 in dim_device.
        data_type: varchar
        tests:
          - not_null
          # NOTE: a regex shape test is more precise but the syntax differs
          # between DuckDB (REGEXP_MATCHES), Snowflake (REGEXP_LIKE), and
          # Spark (RLIKE). Using ``not_null`` here and validating the format
          # at the producer side (data_generators/wearable_generator.py)
          # rather than fighting cross-warehouse SQL.
      - name: battery_pct
        description: Battery percentage 0-100. Lower battery correlates with reading reliability.
        data_type: integer
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              severity: warn
      - name: event_timestamp
        description: When the reading was taken on-device (semantic time, used by watermarks downstream).
        data_type: timestamp
        tests:
          - not_null
      - name: sync_timestamp
        description: When the device synced to ingestion. Latency = sync - event.
        data_type: timestamp
        tests:
          - not_null
      - name: source_type
        description: Data lineage indicator — simulator, whoop_api, or openfda.
        data_type: varchar
        tests:
          - not_null
          - accepted_values:
              values: ['simulator', 'whoop_api', 'openfda']
      - name: is_valid
        description: True if the metric_value passed silver's range check (METRIC_RANGES).
        data_type: boolean
        tests:
          - not_null
      - name: is_late_arriving
        description: True if sync-event lag exceeded settings.late_arrival_threshold_seconds (1 hour).
        data_type: boolean
        tests:
          - not_null
      - name: sync_latency_seconds
        description: Derived. EPOCH(sync - event) in seconds.
        data_type: double
      - name: event_date
        description: Derived. Date partition for downstream marts.
        data_type: date

  - name: stg_ehr_conditions
    description: |
      Staging view over silver ``ehr_conditions``. Joins ICD-10 to
      condition_categories for the ICD-10 chapter rollup. Adds a
      ``condition_key`` surrogate and a ``patient_key`` from the
      patient_email.
    columns:
      - name: condition_key
        description: SHA-256 over condition_id. Primary key.
        tests: [not_null, unique]
      - name: patient_key
        description: SHA-256 over patient_email. FK to dim_patient.
        tests: [not_null]
      - name: condition_id
        description: Per-condition unique identifier from the EHR source.
        tests: [not_null, unique]
      - name: patient_email
        description: Patient email — primary linkage key.
        tests: [not_null]
      - name: mrn
        description: Hospital Medical Record Number.
        tests: [not_null]
      - name: icd10_code
        description: ICD-10-CM diagnosis code.
        tests:
          - not_null
          - relationships:
              to: ref('icd10_codes')
              field: icd10_code
              severity: warn
      - name: condition_name
        description: Human-readable condition name from icd10_codes seed.
      - name: category_code
        description: ICD-10 chapter range (e.g., I00-I99).
        tests:
          - relationships:
              to: ref('condition_categories')
              field: category_code
      - name: category_name
        description: Human-readable chapter name from condition_categories seed.
      - name: icd10_chapter
        description: ICD-10 chapter number 1-22.
      - name: severity_default
        description: Default severity for this code from icd10_codes seed (mild, moderate, severe).
      - name: onset_date
        description: When the condition began.
      - name: recorded_at
        description: When the condition was recorded in the EHR.
        tests: [not_null]
      - name: clinical_status
        description: FHIR clinical-status (active, resolved, inactive).
        tests:
          - accepted_values:
              values: ['active', 'resolved', 'inactive']
      - name: is_primary
        description: Whether this is the patient's primary condition.
        tests: [not_null]

  - name: stg_ehr_medications
    description: |
      Staging view over silver ``ehr_medications``. Computes ``is_active``
      and ``days_on_medication`` for downstream timeline models.
    columns:
      - name: medication_key
        description: SHA-256 over medication_id. Primary key.
        tests: [not_null, unique]
      - name: patient_key
        description: SHA-256 over patient_email. FK to dim_patient.
        tests: [not_null]
      - name: medication_id
        description: Per-prescription unique identifier.
        tests: [not_null, unique]
      - name: patient_email
        description: Patient identifier.
        tests: [not_null]
      - name: mrn
        description: Hospital Medical Record Number.
      - name: rxnorm_code
        description: RxNorm concept identifier.
      - name: medication_name
        description: Generic name of the drug.
        tests: [not_null]
      - name: drug_class
        description: Therapeutic class.
        tests: [not_null]
      - name: prescribed_date
        description: When the prescription was written.
      - name: start_date
        description: When the patient started taking it.
        tests: [not_null]
      - name: end_date
        description: When the prescription ended (NULL if active).
      - name: daily_dose_mg
        description: Daily dosage in milligrams.
      - name: is_active
        description: Derived. TRUE if no end_date or end_date in future.
        tests: [not_null]
      - name: days_on_medication
        description: Derived. Days from start_date to end_date (or today if active).

  - name: stg_pharmacy_fills
    description: |
      Staging view over silver ``pharmacy_fills``. Adds numeric
      ``adverse_event_score`` for ranking and ``fda_processing_days`` derived.
    columns:
      - name: fill_key
        description: SHA-256 over fill_id. Primary key.
        tests: [not_null, unique]
      - name: patient_key
        description: SHA-256 over patient_email. FK to dim_patient.
      - name: fill_id
        description: Per-fill unique identifier.
        tests: [not_null, unique]
      - name: report_id
        description: FDA report identifier.
        tests: [not_null]
      - name: patient_email
        description: Patient identifier when reported by FDA.
      - name: drug_name
        description: Drug name as reported.
        tests: [not_null]
      - name: drug_class
        description: Therapeutic class.
      - name: fill_quantity
        description: Units dispensed.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: days_supply
        description: Intended days of coverage.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: adverse_event
        description: Severity enum.
        tests:
          - not_null
          - accepted_values:
              values: ['none', 'mild', 'moderate', 'severe', 'death']
      - name: adverse_event_score
        description: Derived. Numeric mapping of adverse_event for ranking (0-4).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 4
      - name: event_timestamp
        description: When the adverse event occurred (or fill date if no event).
        tests: [not_null]
      - name: fda_received_at
        description: When FDA received the report.
      - name: is_valid
        description: Range-check pass.
        tests: [not_null]
      - name: fda_processing_days
        description: Derived. fda_received_at - event_timestamp in days.

  - name: stg_identity_bridge
    description: |
      Staging view over silver ``identity_bridge``. Adds bridge_key and
      ``is_resolved`` derived flag.
    columns:
      - name: bridge_key
        description: SHA-256 over (identifier_type, identifier_value). Primary key.
        tests: [not_null, unique]
      - name: identifier_type
        description: Type of external identifier.
        tests:
          - not_null
          - accepted_values:
              values: ['email', 'hospital_mrn', 'device_account_id', 'fda_report_id']
      - name: identifier_value
        description: The actual identifier value.
        tests: [not_null]
      - name: patient_key
        description: SHA-256 of canonical patient_email. NULL if pending.
      - name: link_status
        description: Resolution state.
        tests:
          - not_null
          - accepted_values:
              values: ['linked', 'pending_registration', 'pending_email_linkage']
      - name: link_method
        description: How the link was established.
        tests:
          - not_null
          - accepted_values:
              values: ['ehr_direct', 'transitive_email', 'whoop_api_account', 'pharmacy_email']
      - name: recorded_at
        description: When the bridge row was created or last updated.
        tests: [not_null]
      - name: is_resolved
        description: Derived. patient_key IS NOT NULL AND link_status = 'linked'.
        tests: [not_null]

  - name: stg_ehr_lab_results
    description: |
      Staging view over silver ``ehr_lab_results``. The canonical LOINC-coded
      lab-result stream emitted by the FHIR producer's Observation resources.
      Adds ``lab_result_key`` (SHA-256 over lab_result_id), patient_key,
      ``is_abnormal`` (derived from reference range), and turnaround_hours.
      Will replace the condition-as-lab proxy currently powering fact_lab_result.
    columns:
      - name: lab_result_key
        description: SHA-256 surrogate over lab_result_id. Primary key for fact joins.
        tests: [not_null, unique]
      - name: patient_key
        description: SHA-256 over patient_email. FK to dim_patient.
        tests: [not_null]
      - name: lab_result_id
        description: Per-result unique identifier from the EHR source.
        tests: [not_null, unique]
      - name: patient_email
        description: Patient identifier; primary linkage key.
        tests: [not_null]
      - name: mrn
        description: Hospital Medical Record Number.
      - name: loinc_code
        description: LOINC observation code.
        tests: [not_null]
      - name: test_name
        description: Human-readable test name (HbA1c, Total Cholesterol, etc.).
        tests: [not_null]
      - name: test_category
        description: Lab category — chemistry, hematology, endocrine, etc.
      - name: result_value
        description: Numeric lab result.
      - name: result_unit
        description: Unit (mg/dL, mmol/L, etc.).
      - name: reference_min
        description: Lower bound of the LOINC reference range. NULL when not available.
      - name: reference_max
        description: Upper bound of the LOINC reference range. NULL when not available.
      - name: result_status
        description: Lab-result lifecycle state.
        tests:
          - not_null
          - accepted_values:
              values: ['final', 'preliminary', 'corrected', 'cancelled']
      - name: collected_at
        description: When the specimen was collected.
        tests: [not_null]
      - name: resulted_at
        description: When the lab released the result.
      - name: recorded_at
        description: When the EHR recorded the result.
        tests: [not_null]
      - name: ordering_provider_id
        description: Identifier of the clinician that ordered the lab.
      - name: is_abnormal
        description: Derived. TRUE if result_value is outside reference range; NULL when range unknown.
      - name: turnaround_hours
        description: Derived. resulted_at − collected_at in hours.
      - name: collected_date
        description: Derived. Date partition for downstream marts.

  - name: stg_bronze_sensor_readings
    description: |
      Staging view over the BRONZE ``sensor_readings`` table — raw Kafka-landed
      events before silver applies validation. Used for lineage tracking,
      DLQ debugging, and HIPAA-style audits. Adds ``bronze_reading_key``
      (SHA-256 over reading_id + metric_name + ingestion_timestamp to allow
      duplicate retention), an ingestion_latency_seconds derivation, and a
      partition-friendly event_date.
    columns:
      - name: bronze_reading_key
        description: SHA-256 surrogate (reading_id, metric_name, ingestion_timestamp). PK.
        tests: [not_null, unique]
      - name: reading_id
        description: Globally unique reading identifier from the producer.
        tests: [not_null]
      - name: device_id
        description: Per-device identifier.
        tests: [not_null]
      - name: device_type
        description: Device family. Source enum.
        tests:
          - not_null
          - accepted_values:
              values: ['smartwatch', 'chest_strap', 'sleep_ring', 'blood_pressure_cuff']
      - name: device_account_id
        description: Stable user-device pairing identifier.
        tests: [not_null]
      - name: patient_email
        description: Email when known at device level.
      - name: metric_name
        description: Source metric name (not yet validated against dim_metric at bronze).
        tests: [not_null]
      - name: metric_value
        description: Numeric metric value. May be out-of-range at bronze.
      - name: firmware_version
        description: Format \d+\.\d+\.\d+.
        tests: [not_null]
      - name: battery_pct
        description: Battery percentage 0-100. May be missing at bronze.
      - name: event_timestamp
        description: When the reading was taken on-device.
        tests: [not_null]
      - name: sync_timestamp
        description: When the device synced.
        tests: [not_null]
      - name: ingestion_timestamp
        description: When Kafka received the event.
        tests: [not_null]
      - name: source_type
        description: Data lineage indicator.
        tests:
          - not_null
          - accepted_values:
              values: ['simulator', 'whoop_api', 'openfda']
      - name: kafka_topic
        description: Kafka topic the event landed on.
        tests: [not_null]
      - name: kafka_partition
        description: Kafka partition for this event.
        tests: [not_null]
      - name: kafka_offset
        description: Kafka offset within the partition.
        tests: [not_null]
      - name: ingestion_latency_seconds
        description: Derived. ingestion_timestamp − event_timestamp in seconds.
      - name: event_date
        description: Derived. Date partition.

  - name: stg_observability_monitor_runs
    description: |
      Staging view over the observability ``monitor_runs`` audit ledger. One
      row per (monitor_name, run_id). Powers the per-monitor pass-rate
      dashboards and the daily silver-quality summary. Adds
      ``monitor_run_key`` surrogate, ``expectation_pass_rate`` derived,
      ``duration_seconds`` derived, and a ``is_healthy`` boolean used by
      ops alerts.
    columns:
      - name: monitor_run_key
        description: SHA-256 surrogate (monitor_name, run_id). Primary key.
        tests: [not_null, unique]
      - name: run_id
        description: Per-run unique identifier.
        tests: [not_null]
      - name: monitor_name
        description: Logical monitor name (e.g., gx_silver_sensor_suite).
        tests: [not_null]
      - name: suite_name
        description: GX expectation suite name when applicable.
      - name: layer
        description: Medallion layer the monitor evaluated.
        tests:
          - not_null
          - accepted_values:
              values: ['bronze', 'silver', 'gold']
      - name: table_name
        description: Target table the monitor evaluated.
        tests: [not_null]
      - name: run_status
        description: Monitor lifecycle state.
        tests:
          - not_null
          - accepted_values:
              values: ['success', 'failure', 'skipped']
      - name: rows_evaluated
        description: Row count assessed by this run.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: rows_failed
        description: Row count that violated at least one expectation.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              severity: warn
      - name: expectations_run
        description: Total expectations executed.
        tests: [not_null]
      - name: expectations_failed
        description: Count of failed expectations.
      - name: started_at
        description: Monitor start timestamp.
        tests: [not_null]
      - name: finished_at
        description: Monitor finish timestamp.
        tests: [not_null]
      - name: failure_summary
        description: Short JSON-like description of failures.
      - name: environment
        description: Deployment environment.
        tests:
          - not_null
          - accepted_values:
              values: ['prod', 'dev', 'local']
      - name: expectation_pass_rate
        description: Derived. (expectations_run − expectations_failed) / expectations_run.
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              severity: warn
      - name: duration_seconds
        description: Derived. finished_at − started_at in seconds.
      - name: run_date
        description: Derived. Date partition.
      - name: is_healthy
        description: Derived. TRUE if run_status='success' AND expectations_failed=0.
        tests: [not_null]
