name: PulseTrack CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install black==24.10.0 ruff==0.7.0 mypy==1.13.0
      - run: black --check .
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Cache Ivy / Spark dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ivy2
            ~/.cache/coursier
          key: ${{ runner.os }}-ivy-${{ hashFiles('streaming/spark_config.py') }}
          restore-keys: |
            ${{ runner.os }}-ivy-
      - run: pip install -r requirements.txt
      - name: Run unit tests with coverage gate
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_11_X64 }}
        run: pytest tests/ --ignore=tests/integration -v --cov=. --cov-fail-under=70

  security-scan:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit safety
      - run: bandit -r . -x ./tests,./venv,./.claude --severity-level medium
      - run: safety check --file requirements.txt || true
