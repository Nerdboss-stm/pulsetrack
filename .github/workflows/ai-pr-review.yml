name: AI PR Review (Claude)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'dbt_project/**'

# Only one review per PR at a time. New pushes cancel the in-flight run.
concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-ai-review') &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for accurate diffs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install ai package + deps
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Authenticate gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh auth status

      - name: Build dbt manifest (for lineage context)
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/dbt_project
          DBT_EXTERNAL_ROOT: ${{ github.workspace }}/dbt_project/fixtures
        run: |
          pip install "dbt-duckdb>=1.7,<1.10" "dbt-core>=1.7,<1.10"
          cd dbt_project
          dbt deps
          dbt parse --target dev
        continue-on-error: true   # missing manifest is fine; reviewer degrades gracefully

      - name: Run AI PR reviewer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python -m ai.pr_reviewer \
            --pr ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --manifest dbt_project/target/manifest.json \
            --post
