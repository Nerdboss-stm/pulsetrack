name: secret-scan

# Block merges that introduce credential-shaped strings.
#
# Layered with the pre-commit gitleaks hook: pre-commit catches local
# attempts; this CI gate catches anything that bypasses pre-commit
# (developer skipped hooks, forced push, etc.).
#
# Two scanners run in parallel — they have non-overlapping rule sets.
# Both must pass.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Weekly sweep — catches secrets that snuck in via dependency files,
  # auto-generated artifacts, etc.
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks (project rules + defaults)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — gitleaks scans every commit

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # No license key — gitleaks-action's free tier covers OSS repos
          # and PRs from forks. For private repos consider GITLEAKS_LICENSE.

  trufflehog:
    name: trufflehog (verified-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run trufflehog (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail
